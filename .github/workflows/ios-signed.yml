name: Signed iPad development IPA

on:
  workflow_dispatch:
  push:
    branches: [codex/ios-timetable]
    paths: [.github/signing-trigger.txt]

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Sign and verify app and Safari extension
        env:
          APPLE_DEVELOPMENT_P12_BASE64: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
        run: python3 scripts/sign_ios.py
      - name: Remove signing materials after an interrupted build
        if: always()
        run: python3 scripts/sign_ios.py --cleanup
      - name: Save IPA for USB installation
        uses: actions/upload-artifact@v4
        with:
          name: CampusSSOHelper-development-${{ github.run_id }}
          path: build/ipa/
          retention-days: 3
          if-no-files-found: error
